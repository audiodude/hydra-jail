<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hydra-jail</title>
</head>
<body>
<div id="stage"><canvas id="hydra"></canvas></div>
<div id="statusbar">
  <span id="tab"></span>
  <span id="status">Ctrl+Shift+Enter to run</span>
</div>
<div id="workbench">
  <nav id="activity">
    <button id="toggle-explorer" title="Sketches (Ctrl+B)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 3H6v18h12V7z M14 3v4h4"/><path d="M9 3V1h8l4 4v13h-3"/></svg>
    </button>
  </nav>
  <aside id="explorer" class="closed">
    <header><span>SKETCHES</span><button id="import-sketches" title="Import sketches from a file">⇪</button><button id="export-sketches" title="Export all sketches to a file">⇩</button><button id="new-sketch" title="New sketch">+</button></header>
    <input id="import-file" type="file" accept=".json,application/json" hidden>
    <ul id="sketch-list"></ul>
  </aside>
  <div id="main">
    <div id="bar">
      <button id="run">Run</button>
      <button id="scale" title="Toggle between fit-to-window and 1:1 pixels">1:1</button>
      <label id="render-len" title="Render length in seconds"><input id="render-secs" type="number" value="10" min="1" step="1"> s</label>
      <select id="render-size" title="Render size. 4K takes about 4× as long; uploading 4K also gets better quality from YouTube">
        <option value="1080">1080p</option>
        <option value="2160">4K</option>
      </select>
      <select id="render-depth" title="Render format. 8-bit H.264 plays everywhere; 10-bit VP9 keeps smooth gradients from banding but won't play in QuickTime, Safari or iOS">
        <option value="8">8-bit H.264</option>
        <option value="10">10-bit VP9</option>
      </select>
      <button id="render" title="Frame-exact 60fps render to .mp4 (may run slower than real time)">⏵ Render</button>
    </div>
    <div id="editor"></div>
  </div>
</div>
<dialog id="import-dialog">
  <p id="import-summary"></p>
  <p class="hint"><b>Merge</b> keeps all your sketches and adds the file's. A name you already use with different code comes in as “name (imported)”.<br><b>Overwrite</b> replaces all your sketches with the file's.</p>
  <form method="dialog">
    <button value="cancel">Cancel</button>
    <button value="overwrite" id="import-overwrite">Overwrite</button>
    <button value="merge" autofocus>Merge</button>
  </form>
</dialog>
<script type="module" src="./main.js"></script>
</body>
</html>
