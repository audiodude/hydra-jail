<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hydra-jail</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/blackboard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  html, body { margin: 0; background: #111; color: #ccc; font: 13px/1.4 monospace; }
  #stage { width: 100%; max-width: 1920px; margin: 0 auto; }
  #stage.actual { width: 1920px; max-width: none; }
  canvas { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  #bar { display: flex; gap: 12px; align-items: center; max-width: 1920px; margin: 0 auto; padding: 4px 8px; box-sizing: border-box; }
  #tab { color: #fff; }
  #tab.dirty::after { content: ' ●'; color: #aaa; }
  #status { flex: 1; white-space: pre-wrap; }
  #status.err { color: #f66; }
  button { background: #222; color: #ccc; border: 1px solid #444; font: inherit; padding: 2px 8px; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  #record.on, #render.on { color: #fff; background: #a00; border-color: #f44; }
  #render-secs { width: 4em; background: #222; color: #ccc; border: 1px solid #444; font: inherit; padding: 2px 4px; }

  #workbench { display: flex; height: 40vh; max-width: 1920px; margin: 0 auto; font-family: system-ui, sans-serif; }
  #activity { width: 48px; flex: none; background: #333; display: flex; flex-direction: column; align-items: center; }
  #activity button { width: 48px; height: 48px; border: 0; border-left: 2px solid transparent; background: none; color: #858585; padding: 0; }
  #activity button:hover { color: #fff; }
  #activity button.on { color: #fff; border-left-color: #fff; }
  #explorer { width: 240px; flex: none; background: #252526; display: flex; flex-direction: column; overflow: hidden; }
  #explorer.closed { display: none; }
  #explorer header { display: flex; align-items: center; height: 35px; padding: 0 8px 0 20px; font-size: 11px; letter-spacing: .05em; color: #bbb; }
  #explorer header span { flex: 1; }
  #explorer header button, #sketch-list button { border: 0; background: none; color: #ccc; padding: 0 4px; font-size: 15px; line-height: 1; }
  #explorer header button:hover, #sketch-list button:hover { color: #fff; }
  #sketch-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  #sketch-list li { display: flex; align-items: center; height: 22px; padding: 0 8px 0 20px; cursor: pointer; color: #ccc; border: 1px solid transparent; }
  #sketch-list li:hover { background: #2a2d2e; }
  #sketch-list li.active { background: #37373d; color: #fff; }
  #sketch-list li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sketch-list li.dirty .name::after { content: ' ●'; color: #aaa; }
  #sketch-list li .actions { display: none; }
  #sketch-list li:hover .actions { display: flex; }
  #sketch-list li.editing { padding-left: 16px; }
  #sketch-list input { flex: 1; min-width: 0; background: #3c3c3c; color: #fff; border: 1px solid #007fd4; outline: 0; font: inherit; padding: 0 4px; }
  #sketch-list input.invalid { border-color: #be1100; }
  #sketch-list .empty { padding: 4px 20px; color: #888; cursor: default; }

  #editor { flex: 1; min-width: 0; }
  .CodeMirror { height: 100%; font-family: 'Ubuntu Mono', monospace; font-size: 17px; }
</style>
</head>
<body>
<div id="stage"><canvas id="hydra"></canvas></div>
<div id="bar">
  <span id="tab"></span>
  <span id="status">Ctrl+Shift+Enter to run</span>
  <button id="scale" title="Toggle between fit-to-window and 1:1 pixels">1:1</button>
  <button id="record" title="Record the canvas to a .webm file">⏺ Rec</button>
  <input id="render-secs" type="number" value="10" min="1" max="300" step="1" title="Render length in seconds (max 300)">
  <button id="render" title="Frame-exact 60fps render to .mp4 (may run slower than real time)">⏵ Render</button>
  <button id="run">Run</button>
</div>
<div id="workbench">
  <nav id="activity">
    <button id="toggle-explorer" title="Sketches (Ctrl+B)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 3H6v18h12V7z M14 3v4h4"/><path d="M9 3V1h8l4 4v13h-3"/></svg>
    </button>
  </nav>
  <aside id="explorer" class="closed">
    <header><span>SKETCHES</span><button id="new-sketch" title="New sketch">+</button></header>
    <ul id="sketch-list"></ul>
  </aside>
  <div id="editor"></div>
</div>

<script src="https://unpkg.com/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.10/p5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script type="module">
  // Module scope: Hydra's makeGlobal overwrites window globals like `render`,
  // so our functions must not be globals.
  import { Muxer, ArrayBufferTarget } from 'https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/+esm';
  const WIDTH = 1920, HEIGHT = 1080;
  const KEY_BUFFER = 'hydra-jail:code';         // working buffer, autosaved on run
  const KEY_SKETCHES = 'hydra-jail:sketches';   // { name: code }
  const KEY_CURRENT = 'hydra-jail:current';     // name of the open sketch
  const KEY_EXPLORER = 'hydra-jail:explorer';   // 'closed' when collapsed
  const DEFAULT_CODE = `osc(10, 0.1, 1.2)
  .rotate(() => time * 0.1)
  .kaleid(4)
  .out()`;

  const canvas = document.getElementById('hydra');
  // Fixed render resolution; the canvas is only CSS-scaled for display.
  canvas.width = WIDTH;
  canvas.height = HEIGHT;
  // We drive Hydra's loop ourselves so the offline renderer can pause it and step time exactly.
  const hydra = new Hydra({ canvas, width: WIDTH, height: HEIGHT, detectAudio: false, makeGlobal: true, autoLoop: false });
  let rendering = null; // active offline render job, if any
  let lastFrame = performance.now();
  requestAnimationFrame(function frame(now) {
    // rAF's timestamp can predate a performance.now() taken just before (load, end of a render); never step time backwards.
    if (!rendering) { guardUpdate(); hydra.tick(Math.max(0, now - lastFrame)); }
    lastFrame = now;
    requestAnimationFrame(frame);
  });

  // Track live p5 instances so the renderer can pause them and redraw once per frame.
  const p5Instances = new Set();
  const P5 = window.p5;
  window.p5 = class extends P5 {
    constructor(...args) {
      super(...args);
      p5Instances.add(this);
      const remove = this.remove;
      this.remove = () => { p5Instances.delete(this); remove.call(this); };
    }
  };

  const $ = (id) => document.getElementById(id);
  const status = $('status'), tab = $('tab'), list = $('sketch-list'), explorer = $('explorer');

  // Map, not a plain object, so names like "__proto__" are safe. Returns null if the stored data is unreadable.
  function readSketches() {
    const raw = localStorage.getItem(KEY_SKETCHES);
    if (raw === null) return new Map();
    try {
      const obj = JSON.parse(raw);
      if (obj && typeof obj === 'object' && !Array.isArray(obj) && Object.values(obj).every((v) => typeof v === 'string')) {
        return new Map(Object.entries(obj));
      }
    } catch {}
    return null;
  }

  let startupError = null;
  let sketches = readSketches();
  if (!sketches) {
    // Move the bad data aside instead of letting the next save overwrite it.
    const backup = `${KEY_SKETCHES}:corrupt-${Date.now()}`;
    try {
      localStorage.setItem(backup, localStorage.getItem(KEY_SKETCHES));
      localStorage.removeItem(KEY_SKETCHES);
      startupError = `saved sketches were unreadable; raw data moved to localStorage["${backup}"]`;
    } catch {
      startupError = 'saved sketches are unreadable and could not be backed up; saving is disabled';
    }
    sketches = new Map();
  }
  let current = localStorage.getItem(KEY_CURRENT);
  if (!sketches.has(current)) current = null;

  const editor = CodeMirror($('editor'), {
    value: localStorage.getItem(KEY_BUFFER) ?? (current ? sketches.get(current) : DEFAULT_CODE),
    mode: 'javascript',
    theme: 'blackboard',
    lineNumbers: true,
    tabSize: 2,
    extraKeys: { 'Shift-Ctrl-Enter': run, 'Shift-Cmd-Enter': run },
  });

  function setStatus(text, isError = false) {
    status.className = isError ? 'err' : '';
    status.textContent = text;
  }

  // Hydra catches errors in per-frame code (arrow-function args, `update`) and only logs them,
  // so surface those, plus uncaught ones (p5 draw, timers), in the status bar.
  function reportRuntime(e) {
    const text = `runtime error: ${e?.message ?? e}`;
    if (status.textContent !== text) setStatus(text, true);
  }
  const consoleWarn = console.warn;
  console.warn = (...args) => {
    if (args[0] === 'ERROR' && args.length === 2) reportRuntime(args[1]); // Hydra's arg-function catch
    consoleWarn.apply(console, args);
  };
  window.addEventListener('error', (e) => reportRuntime(e.error ?? e.message));
  window.addEventListener('unhandledrejection', (e) => reportRuntime(e.reason));
  // Hydra re-reads window.update every tick; wrap each new one so its errors are reported, then rethrow for Hydra's log.
  let guardedUpdate = null;
  function guardUpdate() {
    const update = window.update;
    if (typeof update !== 'function' || update === guardedUpdate) return;
    guardedUpdate = window.update = (dt) => { try { update(dt); } catch (e) { reportRuntime(e); throw e; } };
  }

  // localStorage write that reports failure (e.g. quota exceeded) instead of throwing.
  function store(key, value) {
    try {
      if (value === null) localStorage.removeItem(key);
      else localStorage.setItem(key, value);
      return true;
    } catch (e) {
      setStatus(`not saved to localStorage: ${e.message}`, true);
      return false;
    }
  }

  // The buffer and the open sketch's name are written together so a reload restores a matching pair.
  const saveBuffer = () => store(KEY_BUFFER, editor.getValue()) && store(KEY_CURRENT, current);

  // Set while code runs and for a moment after; if a load finds it still set, the last run hung the page.
  const KEY_RUNNING = 'hydra-jail:running'; // sessionStorage
  let runningTimer = 0;

  function run() {
    const code = editor.getValue();
    const saved = saveBuffer();
    sessionStorage.setItem(KEY_RUNNING, '1');
    clearTimeout(runningTimer);
    runningTimer = setTimeout(() => sessionStorage.removeItem(KEY_RUNNING), 2000);
    try {
      (0, eval)(code); // global scope, where Hydra's functions live
      if (saved) setStatus(`ran at ${new Date().toLocaleTimeString()}`);
    } catch (e) {
      setStatus(String(e), true);
    }
  }

  // Untitled counts as dirty once it differs from the starter code, so switching away asks first.
  const isDirty = () => editor.getValue() !== (current === null ? DEFAULT_CODE : sketches.get(current));

  // Read-modify-write against storage, so sketches saved from other tabs aren't clobbered.
  // `mutate` may throw to abort; nothing changes unless the write succeeds.
  function commit(mutate) {
    const next = readSketches();
    try {
      if (!next) throw new Error('stored sketches are unreadable; not overwriting them');
      mutate(next);
      localStorage.setItem(KEY_SKETCHES, JSON.stringify(Object.fromEntries(next)));
    } catch (e) {
      setStatus(`not saved: ${e.message}`, true);
      return false;
    }
    sketches = next;
    return true;
  }

  const claim = (s, name) => { if (s.has(name)) throw new Error(`"${name}" already exists`); };

  let wasDirty = false;
  function render() {
    wasDirty = isDirty();
    tab.textContent = current ?? 'untitled';
    tab.classList.toggle('dirty', wasDirty);
    list.replaceChildren();
    const names = [...sketches.keys()].sort((a, b) => a.localeCompare(b));
    if (!names.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'No sketches. Ctrl+S to save.';
      list.append(li);
    }
    for (const name of names) {
      const li = document.createElement('li');
      li.title = name;
      li.classList.toggle('active', name === current);
      li.classList.toggle('dirty', name === current && isDirty());
      const label = document.createElement('span');
      label.className = 'name';
      label.textContent = name;
      const actions = document.createElement('span');
      actions.className = 'actions';
      actions.append(
        ...(name === current && isDirty() ? [iconButton('↺', 'Revert to saved', revert)] : []),
        iconButton('✎', 'Rename', () => rename(name, li)),
        iconButton('×', 'Delete', () => remove(name)),
      );
      li.append(label, actions);
      li.onclick = () => open(name);
      li.ondblclick = () => rename(name, li);
      list.append(li);
    }
  }

  function revert() {
    if (!confirm(`Revert "${current}" to its saved version?`)) return;
    editor.setValue(sketches.get(current));
    render();
    run();
  }

  function iconButton(text, title, onClick) {
    const b = document.createElement('button');
    b.textContent = text;
    b.title = title;
    b.onclick = (e) => { e.stopPropagation(); onClick(); };
    return b;
  }

  const confirmDiscard = () => !isDirty() || confirm(`Discard unsaved changes to "${current ?? 'untitled'}"?`);

  function open(name) {
    if (name === current || !confirmDiscard()) return;
    current = name;
    editor.setValue(sketches.get(name));
    editor.clearHistory();
    render();
    run();
  }

  // Inline VSCode-style name input. Replaces `li`'s contents (or appends a new row).
  // Enter/blur commits, Escape cancels. onCommit receives a valid, unused name.
  function nameInput(initial, li, onCommit) {
    if (explorer.classList.contains('closed')) toggleExplorer();
    if (!li) { li = document.createElement('li'); list.prepend(li); }
    li.className = 'editing';
    li.onclick = li.ondblclick = null;
    const input = document.createElement('input');
    input.value = initial;
    li.replaceChildren(input);
    input.focus();
    input.select();
    let done = false;
    const validate = () => {
      const name = input.value.trim();
      const ok = name !== '' && (name === initial || !sketches.has(name));
      input.classList.toggle('invalid', !ok);
      input.title = ok ? '' : name ? `"${name}" already exists` : 'Name required';
      return ok ? name : null;
    };
    const finish = (commit) => {
      if (done) return;
      const name = commit ? validate() : null;
      if (commit && name === null && input.value.trim() !== '') return; // keep editing a duplicate
      done = true;
      if (name !== null) onCommit(name);
      render();
      // Defer: focusing the editor mid-keystroke lets the rest of the Enter
      // (keypress/input) land in CodeMirror in some browsers.
      setTimeout(() => editor.focus());
    };
    input.oninput = validate;
    input.onkeydown = (e) => {
      // Ctrl/Cmd+S in the input commits it, like Enter, instead of opening a second name input.
      const saveKey = (e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === 's';
      if (e.key !== 'Enter' && e.key !== 'Escape' && !saveKey) return;
      e.preventDefault();
      e.stopPropagation();
      finish(e.key !== 'Escape');
    };
    input.onblur = () => finish(input.value.trim() !== '' && validate() !== null);
  }

  function save() {
    if (current === null) return saveAs();
    const name = current, code = editor.getValue();
    if (!commit((s) => s.set(name, code))) return;
    saveBuffer();
    render();
    setStatus(`saved "${name}"`);
  }

  function saveAs() {
    nameInput('', null, (name) => {
      const code = editor.getValue();
      if (!commit((s) => { claim(s, name); s.set(name, code); })) return;
      current = name;
      saveBuffer();
      setStatus(`saved "${name}"`);
    });
  }

  function newSketch() {
    // Confirm on commit, not before: a native dialog closing right before the
    // name input appears steals its focus, and blur-while-empty cancels it.
    nameInput('', null, (name) => {
      if (!confirmDiscard()) return;
      if (!commit((s) => { claim(s, name); s.set(name, DEFAULT_CODE); })) return;
      current = name;
      editor.setValue(DEFAULT_CODE);
      editor.clearHistory();
      run();
    });
  }

  function rename(name, li) {
    nameInput(name, li, (newName) => {
      if (newName === name) return;
      const ok = commit((s) => {
        if (!s.has(name)) throw new Error(`"${name}" no longer exists`);
        claim(s, newName);
        s.set(newName, s.get(name));
        s.delete(name);
      });
      if (ok && current === name) { current = newName; saveBuffer(); }
    });
  }

  function remove(name) {
    if (!confirm(`Delete "${name}"?`)) return;
    if (!commit((s) => s.delete(name))) return;
    if (current === name) { current = null; saveBuffer(); } // editor keeps the code as untitled
    render();
  }

  function toggleExplorer() {
    const closed = explorer.classList.toggle('closed');
    $('toggle-explorer').classList.toggle('on', !closed);
    store(KEY_EXPLORER, closed ? 'closed' : 'open');
    editor.refresh();
  }

  // Autosave the buffer as you type, so closing the tab never loses unrun edits.
  let bufferTimer = 0;
  editor.on('change', () => {
    if (isDirty() !== wasDirty) render();
    clearTimeout(bufferTimer);
    bufferTimer = setTimeout(saveBuffer, 500);
  });
  window.addEventListener('pagehide', () => {
    clearTimeout(bufferTimer);
    saveBuffer();
    sessionStorage.removeItem(KEY_RUNNING); // a normal unload, not a hang
  });

  // Another tab changed the sketches: pick them up. The open sketch, if deleted there, becomes untitled here.
  window.addEventListener('storage', (e) => {
    if (e.key !== KEY_SKETCHES && e.key !== null) return;
    const next = readSketches();
    if (!next) return;
    sketches = next;
    if (current !== null && !sketches.has(current)) current = null;
    if (!list.querySelector('.editing')) render(); // an open name input re-renders when it finishes
  });

  document.addEventListener('keydown', (e) => {
    if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 's') { e.preventDefault(); e.shiftKey ? saveAs() : save(); }
    else if (k === 'b' && !e.shiftKey) { e.preventDefault(); toggleExplorer(); }
  });

  function download(blob, ext) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    a.download = `${current ?? 'untitled'}-${stamp}.${ext}`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    setStatus(`saved ${a.download}`);
  }

  let recorder = null;
  function toggleRecording() {
    const btn = $('record');
    if (recorder) { recorder.stop(); return; }
    const mimeType = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
      .find((t) => MediaRecorder.isTypeSupported(t));
    if (!mimeType) return setStatus('recording not supported in this browser', true);
    const chunks = [];
    const started = Date.now();
    recorder = new MediaRecorder(canvas.captureStream(60), { mimeType, videoBitsPerSecond: 20e6 });
    recorder.ondataavailable = (e) => chunks.push(e.data);
    const tick = setInterval(() => {
      const s = Math.floor((Date.now() - started) / 1000);
      btn.textContent = `⏹ ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }, 250);
    recorder.onstop = () => {
      clearInterval(tick);
      recorder = null;
      btn.classList.remove('on');
      btn.textContent = '⏺ Rec';
      $('render').disabled = false;
      download(new Blob(chunks, { type: 'video/webm' }), 'webm');
    };
    recorder.start(1000); // flush every second so a long take isn't one giant buffer
    btn.classList.add('on');
    btn.textContent = '⏹ 0:00';
    $('render').disabled = true;
  }

  // Yield to the event loop without timer throttling (setTimeout is clamped to 1s in background tabs).
  const yieldTask = () => new Promise((r) => { const c = new MessageChannel(); c.port1.onmessage = r; c.port2.postMessage(0); });

  // Offline, frame-exact render: Hydra's `time` advances exactly 1/FPS per frame
  // regardless of how long each frame takes, and every frame is encoded.
  async function renderVideo() {
    if (rendering) { rendering.cancelled = true; return; }
    const FPS = 60;
    const MAX_SECS = 300; // the whole file is held in memory (~150 MB/min at 20 Mbps), then copied into a Blob
    const secs = Number($('render-secs').value);
    if (!(secs > 0)) return setStatus('render length must be a positive number of seconds', true);
    if (secs > MAX_SECS) return setStatus(`render length is capped at ${MAX_SECS} s (5 min) to avoid running out of memory`, true);
    if (!('VideoEncoder' in window)) return setStatus('WebCodecs not supported in this browser', true);
    const total = Math.round(secs * FPS);
    if (total < 1) return setStatus(`render length must be at least one frame (${(1 / FPS).toFixed(3)} s)`, true);

    // Claim the job before any await, so a second click cancels instead of starting a parallel render.
    const job = rendering = { cancelled: false };
    const btn = $('render');
    btn.classList.add('on');
    $('record').disabled = true;
    // Pause looping p5 instances and redraw them once per frame instead. Re-checked every frame, so
    // instances created (or loop()ed) by code run mid-render are caught; ones you stopped yourself stay stopped.
    const paused = new Set();
    const pauseLooping = () => { for (const p of p5Instances) if (p.isLooping()) { p.noLoop(); paused.add(p); } };
    pauseLooping();
    const frameUs = 1e6 / FPS;
    let failed = null, muxer = null, encoder = null, encodeError = null;
    try {
      let pick = null;
      for (const [muxCodec, codec] of [['avc', 'avc1.64002A'], ['vp9', 'vp09.00.41.08']]) {
        const config = { codec, width: WIDTH, height: HEIGHT, bitrate: 20e6, framerate: FPS };
        if ((await VideoEncoder.isConfigSupported(config)).supported) { pick = { muxCodec, config }; break; }
      }
      if (!pick) throw new Error('no supported H.264/VP9 encoder for 1920×1080');

      muxer = new Muxer({
        target: new ArrayBufferTarget(),
        video: { codec: pick.muxCodec, width: WIDTH, height: HEIGHT, frameRate: FPS },
        fastStart: 'in-memory',
      });
      encoder = new VideoEncoder({
        output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
        error: (e) => { encodeError = e; },
      });
      encoder.configure(pick.config);

      // With `fps` set, Hydra only draws on some ticks, and its canvas isn't preserved between draws.
      // Keep the last drawn frame and re-encode it on skipped ticks, so a low-fps sketch renders as it looks live.
      let lastDrawn = null;
      try {
        for (let i = 0; i < total && !job.cancelled; i++) {
          if (encodeError) throw encodeError;
          pauseLooping();
          for (const p of paused) if (p5Instances.has(p) && p._setupDone) p.redraw();
          guardUpdate();
          // Force a draw on the first frame, otherwise the video opens on blank frames until the fps interval elapses.
          if (i === 0 && window.fps) hydra.timeSinceLastUpdate = Math.max(hydra.timeSinceLastUpdate, 1000 / window.fps);
          hydra.tick(1000 / FPS);
          // Capture in the same task as the draw: Hydra's WebGL canvas doesn't preserve its buffer.
          if (hydra.timeSinceLastUpdate === 0 || !lastDrawn) { lastDrawn?.close(); lastDrawn = new VideoFrame(canvas, { timestamp: 0 }); }
          const frame = new VideoFrame(lastDrawn, { timestamp: Math.round(i * frameUs), duration: Math.round(frameUs) });
          encoder.encode(frame, { keyFrame: i % (FPS * 2) === 0 });
          frame.close();
          while (encoder.encodeQueueSize > 4) {
            await new Promise((r) => encoder.addEventListener('dequeue', r, { once: true }));
          }
          if (i % 6 === 0) {
            btn.textContent = `⏹ ${Math.floor((i / total) * 100)}%`;
            await yieldTask();
          }
        }
      } finally {
        lastDrawn?.close();
      }
      if (!job.cancelled) await encoder.flush();
      if (encodeError) throw encodeError;
      if (!job.cancelled) muxer.finalize();
    } catch (e) {
      failed = e;
    } finally {
      if (encoder && encoder.state !== 'closed') encoder.close();
      for (const p of paused) if (p5Instances.has(p)) p.loop(); // not ones removed mid-render
      rendering = null;
      lastFrame = performance.now(); // don't jump time by the render's wall-clock duration
      btn.classList.remove('on');
      btn.textContent = '⏵ Render';
      $('record').disabled = false;
    }
    if (failed) return setStatus(`render failed: ${failed.message ?? failed}`, true);
    if (job.cancelled) return setStatus('render cancelled');
    download(new Blob([muxer.target.buffer], { type: 'video/mp4' }), 'mp4');
  }

  $('record').onclick = toggleRecording;
  $('render').onclick = renderVideo;
  $('run').onclick = run;
  $('new-sketch').onclick = newSketch;
  $('toggle-explorer').onclick = toggleExplorer;
  $('scale').onclick = (e) => {
    const actual = $('stage').classList.toggle('actual');
    e.target.textContent = actual ? 'fit' : '1:1';
  };

  if (localStorage.getItem(KEY_EXPLORER) !== 'closed') toggleExplorer();
  else editor.refresh();
  render();
  if (sessionStorage.getItem(KEY_RUNNING)) {
    sessionStorage.removeItem(KEY_RUNNING);
    setStatus('auto-run skipped: the last run hung or crashed the page. Fix the code, then Run.', true);
  } else {
    run();
  }
  if (startupError) setStatus(startupError, true);
  document.fonts.ready.then(() => editor.refresh()); // re-measure once Ubuntu Mono loads
</script>
</body>
</html>
